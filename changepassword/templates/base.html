<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}{{ title }}{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="home" href="{{ url_for('index') }}">
      <img src="{{ url_for('static', filename='favicon.svg') }}" alt="" width="28" height="28">
      <span>{{ title }}</span>
    </a>
    <nav>
      <a href="{{ url_for('index') }}"{% if request.endpoint in ('index', 'find', 'change') %} aria-current="page"{% endif %}>Change a password</a>
      <a href="{{ url_for('log') }}"{% if request.endpoint == 'log' %} aria-current="page"{% endif %}>Log</a>
    </nav>
    {% if user %}<span class="who">{{ user }}</span>{% endif %}
  </header>
  <main>
{% block main %}{% endblock %}
  </main>
  <footer>
    Times are {{ timezone }}. changepassword {{ version }}.
  </footer>
{% block scripts %}{% endblock %}
</body>
</html>
